<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDY FOCUS :: 시험기간 갓생 패스</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", system-ui, sans-serif;
            background: #090d16;
            background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15, 23, 42, 0.8);
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--accent);
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 1.5rem;
        }

        @media (max-width: 868px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #fff;
        }

        /* Timer UI */
        .timer-display {
            text-align: center;
            padding: 2rem 0;
        }
        .time-text {
            font-size: 4rem;
            font-weight: 900;
            font-family: monospace;
            letter-spacing: -2px;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--accent-hover); transform: translateY(-2px); color: #fff; }
        .btn-outline {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { color: #fff; border-color: #fff; }

        /* D-Day Badges */
        .dday-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.8rem;
        }
        .dday-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            text-align: center;
        }
        .dday-tag { font-size: 0.75rem; color: var(--accent); font-weight: 700; }
        .dday-subject { font-size: 0.9rem; font-weight: 600; margin-top: 0.2rem; }

        /* Todo List */
        .todo-input-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .todo-input-box input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 1rem;
            color: #fff;
            outline: none;
        }
        .todo-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .todo-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(255,255,255,0.02);
            padding: 0.7rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .todo-item.done span { text-decoration: line-through; color: var(--text-sub); }

        /* BGM Player */
        .bgm-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        .bgm-item:hover { background: rgba(56, 189, 248, 0.1); border-color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i> STUDY FOCUS
        </div>
        <div style="font-size: 0.85rem; color: var(--text-sub);">
            🔥 2026 중간고사 극복 프로젝트
        </div>
    </header>

    <div class="container">
        <!-- Main Column -->
        <div>
            <!-- D-Day Box -->
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-fire" style="color:#f43f5e;"></i> 시험 과목 D-Day 카운트다운</div>
                <div class="dday-grid">
                    <div class="dday-item">
                        <div class="dday-tag">D-3</div>
                        <div class="dday-subject">건축구조학</div>
                    </div>
                    <div class="dday-item">
                        <div class="dday-tag">D-5</div>
                        <div class="dday-subject">BIM 원론</div>
                    </div>
                    <div class="dday-item">
                        <div class="dday-tag">D-7</div>
                        <div class="dday-subject">시공재료학</div>
                    </div>
                    <div class="dday-item">
                        <div class="dday-tag">D-9</div>
                        <div class="dday-subject">공간디자인</div>
                    </div>
                </div>
            </div>

            <!-- Pomodoro Timer -->
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-stopwatch"></i> 뽀모도로 몰입 스터디 타이머</div>
                <div class="timer-display">
                    <div class="time-text" id="timerDisplay">25:00</div>
                    <p style="color: var(--text-sub); font-size: 0.85rem; margin-top: 0.5rem;" id="timerStatus">25분 집중 공부 세션</p>
                    <div class="timer-controls">
                        <button class="btn" onclick="startTimer()"><i class="fa-solid fa-play"></i> 시작</button>
                        <button class="btn btn-outline" onclick="pauseTimer()"><i class="fa-solid fa-pause"></i> 일시정지</button>
                        <button class="btn btn-outline" onclick="resetTimer()"><i class="fa-solid fa-rotate-right"></i> 리셋</button>
                    </div>
                </div>
            </div>

            <!-- Todo List -->
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-list-check"></i> 오늘 끝낼 시험공부 목표</div>
                <div class="todo-input-box">
                    <input type="text" id="todoInput" placeholder="예: 전공서적 45p~80p 요약 정리하기..." onkeypress="if(event.key==='Enter') addTodo()">
                    <button class="btn" onclick="addTodo()">추가</button>
                </div>
                <div class="todo-list" id="todoList"></div>
            </div>
        </div>

        <!-- Sidebar Column -->
        <div>
            <!-- Focus BGM Player -->
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-headphones"></i> 집중용 BGM & Lo-Fi</div>
                <div class="bgm-item" onclick="playBgm('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', '빗소리 & 피아노 Lo-Fi')">
                    <div>
                        <div style="font-weight: 600; font-size: 0.9rem;">☔ 빗소리 & 피아노</div>
                        <div style="font-size: 0.75rem; color: var(--text-sub);">집중력 높여주는 오디오</div>
                    </div>
                    <i class="fa-solid fa-circle-play" style="color: var(--accent);"></i>
                </div>
                <div class="bgm-item" onclick="playBgm('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', '새벽 자취방 딥 스터디')">
                    <div>
                        <div style="font-weight: 600; font-size: 0.9rem;">🌙 새벽 딥 스터디 BGM</div>
                        <div style="font-size: 0.75rem; color: var(--text-sub);">잔잔한 엠비언트 사운드</div>
                    </div>
                    <i class="fa-solid fa-circle-play" style="color: var(--accent);"></i>
                </div>

                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                    <div style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 0.3rem;" id="bgmNow">재생중: 없음</div>
                    <audio id="bgmAudio" controls style="width: 100%; height: 35px;"></audio>
                </div>
            </div>

            <!-- Motivational Quote -->
            <div class="card" style="text-align: center; background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(139, 92, 246, 0.1));">
                <i class="fa-solid fa-quote-left" style="color: var(--accent); font-size: 1.5rem;"></i>
                <p style="font-size: 0.9rem; font-weight: 600; margin: 0.8rem 0; line-height: 1.5;">
                    "오늘 도서관에서 보낸 1시간이 종강 후 자유의 시간을 결정한다!"
                </p>
                <span style="font-size: 0.75rem; color: var(--text-sub);">- 시험기간 동기부여 -</span>
            </div>
        </div>
    </div>

    <script>
        // Timer Logic
        let timeLeft = 25 * 60;
        let timerInterval = null;

        function updateTimerDisplay() {
            const min = Math.floor(timeLeft / 60);
            const sec = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = 
                `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerInterval) return;
            document.getElementById('timerStatus').innerText = "🔥 몰입 공부 진행 중...";
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    alert("🎉 25분 집중 완료! 5분간 휴식하세요.");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('timerStatus').innerText = "⏸️ 일시정지됨";
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = 25 * 60;
            updateTimerDisplay();
            document.getElementById('timerStatus').innerText = "25분 집중 공부 세션";
        }

        // Todo List Logic
        let todos = JSON.parse(localStorage.getItem('studyTodos') || '[]');

        function renderTodos() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            todos.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = `todo-item ${t.done ? 'done' : ''}`;
                item.innerHTML = `
                    <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${i})">
                    <span style="flex:1;">${t.text}</span>
                    <i class="fa-solid fa-trash" style="cursor:pointer; color:#94a3b8; font-size:0.85rem;" onclick="deleteTodo(${i})"></i>
                `;
                list.appendChild(item);
            });
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            if (!input.value.trim()) return;
            todos.push({ text: input.value.trim(), done: false });
            localStorage.setItem('studyTodos', JSON.stringify(todos));
            input.value = '';
            renderTodos();
        }

        function toggleTodo(i) {
            todos[i].done = !todos[i].done;
            localStorage.setItem('studyTodos', JSON.stringify(todos));
            renderTodos();
        }

        function deleteTodo(i) {
            todos.splice(i, 1);
            localStorage.setItem('studyTodos', JSON.stringify(todos));
            renderTodos();
        }

        // BGM Logic
        function playBgm(url, title) {
            const audio = document.getElementById('bgmAudio');
            document.getElementById('bgmNow').innerText = `재생중: ${title}`;
            audio.src = url;
            audio.play();
        }

        renderTodos();
    </script>
</body>
</html>
