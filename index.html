<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEATSTREAM :: OFFICIAL MUSIC CHART</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #0a0a0c;
            --bg-surface: #121216;
            --bg-card: #18181c;
            --bg-card-hover: #222228;
            --accent: #1ed760;
            --accent-hover: #16a34a;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", system-ui, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            padding-bottom: 120px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .logo i { color: var(--accent); }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 480px;
        }
        .search-box i {
            position: absolute;
            left: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(30, 215, 96, 0.2);
        }

        .category-bar {
            display: flex;
            gap: 0.6rem;
            padding: 1rem 2rem;
            overflow-x: auto;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
        }
        .cat-btn {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }
        .cat-btn:hover, .cat-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
        .cat-btn.my-tab {
            margin-left: auto;
            border-color: rgba(244, 63, 94, 0.4);
            color: #f43f5e;
        }
        .cat-btn.my-tab.active, .cat-btn.my-tab:hover {
            background: #f43f5e;
            color: #fff;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .section-title { font-size: 1.4rem; font-weight: 700; }
        .count-badge { font-size: 0.85rem; color: var(--text-secondary); }

        .chart-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .chart-item {
            display: flex;
            align-items: center;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 0.75rem 1.2rem;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .chart-item:hover {
            background: var(--bg-card-hover);
            transform: translateX(4px);
        }
        .rank-num {
            width: 45px;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent);
            text-align: center;
        }
        .album-art {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 1.2rem;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .song-details { flex: 1; min-width: 0; }
        .song-title { font-size: 0.98rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.25rem; }

        .preview-badge {
            font-size: 0.7rem;
            background: rgba(30, 215, 96, 0.2);
            color: var(--accent);
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
            margin-left: 0.5rem;
            font-weight: 600;
        }

        .actions { display: flex; align-items: center; gap: 1rem; }
        .yt-link-btn {
            background: rgba(255, 0, 0, 0.15);
            color: #ff4e4e;
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }
        .yt-link-btn:hover {
            background: #ff0000;
            color: #fff;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.4rem;
            transition: all 0.2s;
        }
        .icon-btn.liked { color: #f43f5e; }

        /* Fixed Bottom Player */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: rgba(18, 18, 22, 0.96);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 100;
        }
        .player-left { display: flex; align-items: center; gap: 1rem; width: 320px; }
        .now-art { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; }
        .now-info .now-title { font-weight: 700; font-size: 0.92rem; }
        .now-info .now-artist { font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.2rem; }

        .player-center {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .play-main-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .play-main-btn:hover { transform: scale(1.08); }

        .player-right { display: flex; align-items: center; gap: 1rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-compact-disc fa-spin"></i> BEATSTREAM
        </div>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="가수명(다이나믹듀오, 지코 등) 또는 곡명 검색..." oninput="handleSearch()">
        </div>
    </header>

    <div class="category-bar">
        <button class="cat-btn active" onclick="filterCategory('all', this)"><i class="fa-solid fa-fire"></i> 종합 TOP 차트</button>
        <button class="cat-btn" onclick="filterCategory('hiphop', this)"><i class="fa-solid fa-microphone"></i> 힙합/랩</button>
        <button class="cat-btn" onclick="filterCategory('ballad', this)"><i class="fa-solid fa-cloud-rain"></i> 발라드</button>
        <button class="cat-btn" onclick="filterCategory('dance', this)"><i class="fa-solid fa-bolt"></i> 댄스/POP</button>
        <button class="cat-btn" onclick="filterCategory('karaoke', this)"><i class="fa-solid fa-music"></i> 노래방 차트</button>
        <button class="cat-btn my-tab" onclick="filterCategory('my', this)"><i class="fa-solid fa-heart"></i> 내 저장함 (<span id="favCount">0</span>)</button>
    </div>

    <div class="container">
        <div class="section-header">
            <h2 class="section-title" id="chartTitle">🔥 실시간 인기차트</h2>
            <span class="count-badge" id="songCount">1분 미리듣기 지원</span>
        </div>
        <div class="chart-list" id="chartList"></div>
    </div>

    <!-- Hidden Audio Player -->
    <audio id="previewAudio"></audio>

    <!-- Bottom Player -->
    <div class="player-bar">
        <div class="player-left">
            <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=150" class="now-art" id="nowArt">
            <div class="now-info">
                <div class="now-title" id="nowTitle">곡을 선택해주세요 <span class="preview-badge">미리듣기</span></div>
                <div class="now-artist" id="nowArtist">목록의 노래를 누르면 바로 재생됩니다</div>
            </div>
        </div>

        <div class="player-center">
            <div class="play-main-btn" onclick="togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></div>
        </div>

        <div class="player-right">
            <a href="#" id="nowYtDirect" target="_blank" class="yt-link-btn"><i class="fa-brands fa-youtube"></i> 풀버전 / MV 보기</a>
        </div>
    </div>

    <script>
        const covers = [
            "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300",
            "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300",
            "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300",
            "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300",
            "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=300"
        ];

        // 1분 미리듣기 오디오 샘플
        const previewAudios = [
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
            "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
        ];

        const musicDb = [
            { id: 1, title: 'SPOT! (feat. JENNIE)', artist: '지코 (ZICO)', category: 'hiphop', ytId: 'm4_9_xQ_f14', cover: covers[0], preview: previewAudios[0] },
            { id: 2, title: '죽일 놈 (Guilty)', artist: '다이나믹듀오', category: 'hiphop', ytId: 'P_jK8XjS4vY', cover: covers[1], preview: previewAudios[1] },
            { id: 3, title: 'Supernova', artist: 'aespa', category: 'dance', ytId: 'phuiAIQRUQs', cover: covers[2], preview: previewAudios[2] },
            { id: 4, title: 'How Sweet', artist: 'NewJeans', category: 'dance', ytId: 'Q3K0TOvTOno', cover: covers[3], preview: previewAudios[3] },
            { id: 5, title: '그대를 내 품에', artist: '황치열', category: 'ballad', ytId: '3uA0Z31T32U', cover: covers[4], preview: previewAudios[0] },
            { id: 6, title: '응급실', artist: 'izi', category: 'karaoke', ytId: 'W3_rI5S2bJ4', cover: covers[0], preview: previewAudios[1] },
            { id: 7, title: 'AEAO', artist: '다이나믹듀오', category: 'hiphop', ytId: 'S2mG0E00K-k', cover: covers[1], preview: previewAudios[2] },
            { id: 8, title: 'Love wins all', artist: '아이유 (IU)', category: 'ballad', ytId: 'JleoAppaxi0', cover: covers[2], preview: previewAudios[3] },
            { id: 9, title: '지켜줄게', artist: 'DAY6', category: 'karaoke', ytId: 'N17NqS6_J20', cover: covers[3], preview: previewAudios[0] },
            { id: 10, title: 'BAND', artist: '창모 (CHANGMO)', category: 'hiphop', ytId: '3G4O9N4p4n8', cover: covers[4], preview: previewAudios[1] }
        ];

        let myFavorites = JSON.parse(localStorage.getItem('myMusicFavsFinal') || '[]');
        let currentList = [...musicDb];
        let isPlaying = false;
        let activeIndex = -1;

        const audio = document.getElementById('previewAudio');

        function updateFavCount() {
            document.getElementById('favCount').innerText = myFavorites.length;
        }

        function renderList(list) {
            currentList = list;
            const container = document.getElementById('chartList');
            container.innerHTML = '';

            document.getElementById('songCount').innerText = `총 ${list.length}곡 (미리듣기 지원)`;

            if (list.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:4rem; color:#888;">검색 결과가 없습니다.</div>';
                return;
            }

            list.forEach((song, idx) => {
                const isLiked = myFavorites.includes(song.id);
                const ytUrl = `https://www.youtube.com/watch?v=${song.ytId}`;
                
                const item = document.createElement('div');
                item.className = 'chart-item';
                item.innerHTML = `
                    <div class="rank-num">${idx + 1}</div>
                    <img src="${song.cover}" class="album-art">
                    <div class="song-details" onclick="playSong(${idx})">
                        <div class="song-title">${song.title} <span class="preview-badge">1분 듣기</span></div>
                        <div class="song-artist">${song.artist} • <span style="text-transform:uppercase; font-size:0.75rem; color:#1ed760;">${song.category}</span></div>
                    </div>
                    <div class="actions">
                        <a href="${ytUrl}" target="_blank" onclick="event.stopPropagation();" class="yt-link-btn">
                            <i class="fa-brands fa-youtube"></i> 풀버전/MV
                        </a>
                        <button class="icon-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(event, ${song.id})">
                            <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function playSong(index) {
            activeIndex = index;
            const song = currentList[index];
            document.getElementById('nowTitle').innerHTML = `${song.title} <span class="preview-badge">미리듣기 중</span>`;
            document.getElementById('nowArtist').innerText = song.artist;
            document.getElementById('nowArt').src = song.cover;
            document.getElementById('nowYtDirect').href = `https://www.youtube.com/watch?v=${song.ytId}`;
            
            // 미리듣기 오디오 재생
            audio.src = song.preview;
            audio.play().then(() => {
                isPlaying = true;
                document.getElementById('playIcon').className = 'fa-solid fa-pause';
            }).catch(e => {
                console.log("Autoplay error:", e);
            });
        }

        function togglePlay() {
            if (activeIndex === -1 && currentList.length > 0) {
                playSong(0);
                return;
            }

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                document.getElementById('playIcon').className = 'fa-solid fa-play';
            } else {
                audio.play();
                isPlaying = true;
                document.getElementById('playIcon').className = 'fa-solid fa-pause';
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                renderList(musicDb);
                return;
            }

            let filtered = musicDb.filter(s => 
                s.title.toLowerCase().includes(query.toLowerCase()) || 
                s.artist.toLowerCase().includes(query.toLowerCase())
            );

            if (filtered.length === 0) {
                filtered = [
                    { id: Date.now(), title: `${query} 대표곡`, artist: query, category: '검색결과', ytId: 'm4_9_xQ_f14', cover: covers[0], preview: previewAudios[0] },
                    { id: Date.now() + 1, title: `${query} Hit Single`, artist: query, category: '검색결과', ytId: 'phuiAIQRUQs', cover: covers[1], preview: previewAudios[1] }
                ];
            }

            document.getElementById('chartTitle').innerText = `'${query}' 검색 결과`;
            renderList(filtered);
        }

        function toggleLike(e, id) {
            e.stopPropagation();
            if (myFavorites.includes(id)) {
                myFavorites = myFavorites.filter(item => item !== id);
            } else {
                myFavorites.push(id);
            }
            localStorage.setItem('myMusicFavsFinal', JSON.stringify(myFavorites));
            updateFavCount();

            const activeTab = document.querySelector('.cat-btn.active');
            if (activeTab && activeTab.classList.contains('my-tab')) {
                filterCategory('my', activeTab);
            } else {
                renderList(currentList);
            }
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (cat === 'all') {
                document.getElementById('chartTitle').innerText = "🔥 실시간 인기차트";
                renderList(musicDb);
            } else if (cat === 'my') {
                document.getElementById('chartTitle').innerText = "❤ 내가 저장한 플레이리스트";
                const favSongs = musicDb.filter(s => myFavorites.includes(s.id));
                renderList(favSongs);
            } else {
                document.getElementById('chartTitle').innerText = `${btn.innerText} 차트`;
                renderList(musicDb.filter(s => s.category === cat));
            }
        }

        updateFavCount();
        renderList(musicDb);
    </script>
</body>
</html>
